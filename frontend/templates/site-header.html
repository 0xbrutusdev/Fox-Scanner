<header class="top">
  <div class="wrap">
    <a class="brand" href="/" aria-label="FoxScanner home"><img src="/static/img/logo.png?v=" alt="" width="36" height="36"><b>FOX<span>SCAN</span></b></a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">
      <span class="sr" data-i18n="Open navigation">Open navigation</span>
      <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>
    <nav class="nav" id="site-nav" data-site-nav aria-label="Main">
      <a href="/"{{home_active}} data-i18n="Home">Home</a>
      <a href="/tokens"{{tokens_active}} data-i18n="Tokens">Tokens</a>
      <a href="/radar"{{radar_active}} data-i18n="Radar">Radar</a>
      <a href="/token-management"{{token_management_active}} data-i18n="Manage">Manage</a>
      <a href="/api"{{api_active}} data-i18n="API">API</a>
      <a href="/about"{{about_active}} data-i18n="About">About</a>
    </nav>
    <div class="top-actions">
      <div class="wallet">
        <button type="button" class="wallet-btn" data-wallet aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1" fill="currentColor" stroke="none"/></g></svg>
          <span data-wallet-label data-i18n="Connect Wallet">Connect Wallet</span>
        </button>
        <div class="wallet-menu" data-wallet-menu hidden role="menu"><button type="button" data-disconnect role="menuitem" data-i18n="Disconnect">Disconnect</button></div>
      </div>
      <button type="button" class="icon-btn" data-theme-toggle aria-pressed="false" aria-label="Light mode">
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></g></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg>
      </button>
      <div class="lang">
        <button type="button" class="lang-btn" data-lang-toggle aria-haspopup="listbox" aria-expanded="false" data-i18n-aria="Language" aria-label="Language"><span data-lang-code>EN</span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg></button>
        <ul class="lang-menu" role="listbox" hidden><li role="none"><button type="button" role="option" data-lang="en">English</button></li><li role="none"><button type="button" role="option" data-lang="zh">中文(简体)</button></li><li role="none"><button type="button" role="option" data-lang="ja">日本語</button></li></ul>
      </div>
    </div>
  </div>
</header>
