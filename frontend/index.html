<!doctype html>
<!-- Shared site chrome is rendered by backend/foxscanner/server.py::render_site_page. -->
<html lang="en"><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bolt" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></g></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M5 20V12M10 20V8M15 20v-6M20 20V4"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M12 3 4 6v6c0 4.5 3.3 8 8 9 4.7-1 8-4.5 8-9V6z"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></g></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path stroke-linecap="round" d="M12 10v4.5M12 17.2v.1"/></g></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></g></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></g></symbol>
</svg>

<main>
  <section class="hero home-terminal" id="top">
    <div class="wrap stage">
      <h1 class="home-title" data-i18n="Check BNB token for rug risk">Check BNB token for rug risk</h1>
      <div class="hero-art home-hero-art" aria-label="FoxTrace evidence preview">
        <div class="watermark"><span class="lh-1 fw-bold flex-shrink-0" data-text="FOX"></span><span class="lh-1 fw-bold flex-shrink-0" data-text="SCAN"></span></div>
        <img src="/static/img/mascot-hero.png?v=" alt="" width="858" height="637" fetchpriority="high">
      </div>
      <div class="finder">
        <form class="search" id="scan-form" data-scan-form autocomplete="off">
          <label class="sr" for="ca">Token address, name, or symbol</label>
          <span class="search-mark" aria-hidden="true"><svg viewBox="0 0 126.61 126.61"><path fill="#F3BA2F" d="M38.73 53.2 63.32 28.62l24.6 24.6 14.3-14.31L63.32 0 24.42 38.9l14.31 14.3zM0 63.31l14.3-14.31 14.31 14.31-14.31 14.3L0 63.31zM38.73 73.41l24.59 24.59 24.6-24.6 14.31 14.29-38.9 38.91-38.9-38.88 14.3-14.31zM98 63.31l14.3-14.31 14.31 14.3-14.31 14.32L98 63.31zM77.83 63.3 63.32 48.78 52.59 59.51l-1.24 1.23-2.23 2.23-.36.37.36.36 14.2 14.2 14.51-14.52.01-.08z"/></svg></span>
          <input id="ca" name="ca" spellcheck="false" inputmode="text" placeholder="Token address, name, or symbol" autocomplete="off">
          <span class="search-go" aria-hidden="true"><svg><use href="#i-scan"/></svg></span>
        </form>
        <div class="trend" data-trend hidden></div>
      </div>
      <div class="hero-actions">
        <button class="hero-btn hero-btn-check" type="submit" form="scan-form" data-go><span data-i18n="Check">Check</span></button>
        <a class="hero-btn hero-btn-side" href="/token-management" data-i18n="Manage">Manage</a>
        {{replay_cta}}
      </div>
      <p class="form-msg" data-form-msg role="status"></p>
    </div>
  </section>

  <section id="recent" class="ticker" aria-label="Recently Verified">
    <div class="wrap">
      <h2 class="ticker-label"><span data-i18n="Recently Verified">Recently Verified</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="m8 12.2 2.4 2.4 5.2-5.4"/></svg></h2>
      <div class="marquee" data-recent-track></div>
    </div>
  </section>

  <section id="scanner" class="sec hidden" aria-live="polite">
    <div class="wrap scan-grid">
      <aside class="card console" data-console>
        <div class="card-h"><h3 data-console-title>Scan</h3><span class="live"><span class="dot"></span><span data-i18n="live">live</span></span></div>
        <ol class="steps" data-steps></ol>
        <div class="bar"><div data-bar></div></div>
        <ul class="log" data-log></ul>
      </aside>
      <div>
        <div class="card error-card" data-result-wait>
          <img src="/static/img/logo.png?v=" alt="">
          <h3 data-i18n="The fox is on it">The fox is on it</h3>
          <p data-i18n="Reading launch, transfers and holder wallets. Most scans take 10–40 seconds.">Reading launch, transfers and holder wallets. Most scans take 10–40 seconds.</p>
        </div>
        <div class="result" data-result></div>
      </div>
    </div>
  </section>

</main>
</body></html>
