<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="Tokens · FoxScanner">Tokens · FoxScanner</title>
<meta name="description" content="Recently verified, most checked, and newly created tokens on BNB Chain.">
<meta name="theme-color" content="#0B0B0B">
<script>(function(){try{if(localStorage.getItem('fs.theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}})();</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/static/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/orbitron-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/app.css?v=">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/" aria-label="FoxScanner home"><img src="/static/img/logo.png?v=" alt="" width="36" height="36"><b>FOX<span>SCANNER</span></b></a>
    <nav class="nav" aria-label="Main">
      <a href="/" data-i18n="Home">Home</a>
      <a href="/tokens" class="on" aria-current="page" data-i18n="Tokens">Tokens</a>
      <a href="/radar" data-i18n="Radar">Radar</a>
      <a href="/token-management" data-i18n="Manage">Manage</a>
      <a href="/api" data-i18n="API">API</a>
      <a href="/about" data-i18n="About">About</a>
    </nav>
    <div class="top-actions">
      <div class="wallet">
        <button type="button" class="wallet-btn" data-wallet aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1" fill="currentColor" stroke="none"/></g></svg>
          <span data-wallet-label data-i18n="Connect Wallet">Connect Wallet</span>
        </button>
        <div class="wallet-menu" data-wallet-menu hidden role="menu">
          <button type="button" data-disconnect role="menuitem" data-i18n="Disconnect">Disconnect</button>
        </div>
      </div>
      <button type="button" class="icon-btn" data-theme-toggle aria-pressed="false" aria-label="Light mode">
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></g></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg>
      </button>
      <div class="lang">
        <button type="button" class="lang-btn" data-lang-toggle aria-haspopup="listbox" aria-expanded="false" data-i18n-aria="Language" aria-label="Language">
          <span data-lang-code>EN</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
        </button>
        <ul class="lang-menu" role="listbox" hidden>
          <li role="none"><button type="button" role="option" data-lang="en">English</button></li>
          <li role="none"><button type="button" role="option" data-lang="zh">中文(简体)</button></li>
          <li role="none"><button type="button" role="option" data-lang="ja">日本語</button></li>
        </ul>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="tokens">
    <div class="wrap">
      <div class="tokens-head">
        <h1 data-i18n="Recently Verified">Recently Verified</h1>
      </div>
      <div class="token-chips" data-chips></div>
      <div class="token-grid">
        <section class="token-panel" aria-labelledby="most-viewed">
          <div class="token-panel-h">
            <h2 id="most-viewed" data-i18n="Most Viewed">Most Viewed</h2>
            <div class="token-tools">
              <div class="ranges" data-ranges>
                <button type="button" data-window="5m">5M</button>
                <button type="button" data-window="30m">30M</button>
                <button type="button" data-window="1h">1H</button>
                <button type="button" data-window="6h">6H</button>
                <button type="button" class="on" data-window="24h">24H</button>
              </div>
              <button type="button" class="icon-btn token-refresh" data-refresh="viewed" data-i18n-aria="Refresh" aria-label="Refresh">
                <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></g></svg>
              </button>
            </div>
          </div>
          <div class="token-scroll">
            <table>
              <thead>
                <tr>
                  <th data-i18n="Token">Token</th>
                  <th data-i18n="Name">Name</th>
                  <th data-i18n="Checks">Checks</th>
                  <th data-i18n="Risk">Risk</th>
                </tr>
              </thead>
              <tbody data-viewed></tbody>
            </table>
          </div>
        </section>
        <section class="token-panel" aria-labelledby="new-tokens">
          <div class="token-panel-h">
            <h2 id="new-tokens" data-i18n="New Tokens">New Tokens</h2>
            <button type="button" class="icon-btn token-refresh" data-refresh="new" data-i18n-aria="Refresh" aria-label="Refresh">
              <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></g></svg>
            </button>
          </div>
          <div class="token-scroll">
            <table>
              <thead>
                <tr>
                  <th data-i18n="Token">Token</th>
                  <th data-i18n="Created">Created</th>
                </tr>
              </thead>
              <tbody data-new></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <div class="foot-left">
      <p class="foot-follow"><span data-i18n="Follow us:">Follow us:</span>
      <a href="https://x.com/0x_Punisher" target="_blank" rel="noopener" aria-label="FoxScanner on X"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.7 10.3 22.4 2h-1.8l-6.7 7.2L8.6 2H2l8.1 11.1L2 22h1.8l7.1-7.6L15.4 22H22l-7.3-11.7Zm-2.5 2.7-.8-1.1L4.6 3.3h2.8l5.3 7 .8 1.1 6.9 9.3h-2.8l-5.4-7.7Z"/></svg></a>
      </p>
    </div>
    <p class="foot-copy" data-i18n="2026 © FoxScanner. All rights reserved.">2026 © FoxScanner. All rights reserved.</p>
  </div>
</footer>

<script src="/static/js/api.js?v="></script>
<script src="/static/js/app.js?v="></script>
<script src="/static/js/tokens.js?v="></script>
</body>
</html>
