<!doctype html>
<!-- Shared site chrome is rendered by backend/foxscanner/server.py::render_site_page. -->
<html lang="en"><body>
<main>
  <section class="radar-page" data-radar>
    <div class="wrap">
      <div class="radar-hero">
        <div>
          <p class="radar-live"><i></i><span data-i18n="Live · updates every 15 seconds">Live · updates every 15 seconds</span></p>
          <h1>Launch <span class="radar-accent" data-i18n="Radar">Radar</span></h1>
          <p class="radar-lead" data-i18n="Fresh memecoins that came out clean in our scans.">Fresh memecoins that came out clean in our scans.</p>
          <p class="radar-lead" data-i18n="No bundles, insiders, clusters or operators holding a major part of the supply.">No bundles, insiders, clusters or operators holding a major part of the supply.</p>
          <div class="radar-stats">
            <div><span data-i18n="On radar now">On radar now</span><b data-radar-count aria-live="polite">—</b></div>
            <div><span data-i18n="Window">Window</span><b data-i18n="7 days">7 days</b></div>
          </div>
          <div class="radar-controls" data-radar-filters aria-label="Radar filters">
            <span class="radar-controls-label" data-i18n="Launchpad">Launchpad</span>
            <button type="button" class="is-active" data-radar-filter="all" aria-pressed="true" data-i18n="All">All</button>
            <button type="button" data-radar-filter="flap" aria-pressed="false">Flap</button>
            <button type="button" data-radar-filter="genius" aria-pressed="false">Genius.fun</button>
          </div>
          <p class="radar-refresh-state" data-radar-state aria-live="polite"><span class="radar-state-dot"></span><span data-i18n="Waiting for the first update">Waiting for the first update</span></p>
        </div>
        <div class="radar-scope">
          <div class="radar-disc">
            <svg class="radar-dial" data-radar-dial viewBox="0 0 100 100" aria-hidden="true"></svg>
            <div class="radar-sweep"></div>
            <span class="radar-mark radar-mark-out" data-radar-out>7d</span>
            <span class="radar-mark radar-mark-mid" data-radar-mid>3d</span>
            <span class="radar-mark radar-mark-now" data-radar-now data-i18n="now">now</span>
          </div>
          <div class="radar-blips" data-radar-blips></div>
          <div class="radar-legend" aria-label="Radar legend"><span><i class="legend-dot legend-dot-clean"></i><span data-i18n="Clean score">Clean score</span></span><span><i class="legend-line"></i><span data-i18n="Older launch">Older launch</span></span></div>
        </div>
      </div>
      <div class="radar-grid" data-radar-list></div>
    </div>
  </section>
</main>
</body></html>
