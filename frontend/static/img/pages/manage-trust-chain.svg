<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Token identity trust chain</title>
  <desc id="desc">A wallet signature connects a token contract to a verified public identity without changing its risk score.</desc>
  <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#ffd800"/><stop offset="1" stop-color="#f5a524"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="720" height="320" rx="24" fill="#0b0b0b"/>
  <g fill="none" stroke="#343434" stroke-width="2"><path d="M110 160H610" stroke-dasharray="7 9"/><path d="M230 160l26-26m-26 26 26 26M464 134l26 26-26 26"/></g>
  <g font-family="Inter,system-ui" text-anchor="middle"><g transform="translate(110 160)"><circle r="54" fill="#141414" stroke="#ffd800"/><path d="M-22-8h44v31h-44zM-22 0h44M12 11h4" fill="none" stroke="#ffd800" stroke-width="4"/><text y="82" fill="#f5f5f5" font-size="14" font-weight="700">OWNER WALLET</text><text y="102" fill="#777" font-size="11">control proof</text></g><g transform="translate(360 160)"><circle r="64" fill="#181818" stroke="url(#g)" stroke-width="3" filter="url(#glow)"/><path d="M-18 2l12 12 27-31" fill="none" stroke="#ffd800" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text y="92" fill="#f5f5f5" font-size="14" font-weight="700">SIGNED LINK</text><text y="112" fill="#777" font-size="11">message + address</text></g><g transform="translate(610 160)"><circle r="54" fill="#141414" stroke="#22c55e"/><path d="M-20-22h40v44h-40zM-11-9h22M-11 2h22M-11 13h13" fill="none" stroke="#22c55e" stroke-width="3"/><text y="82" fill="#f5f5f5" font-size="14" font-weight="700">PUBLIC IDENTITY</text><text y="102" fill="#777" font-size="11">verified, score unchanged</text></g></g>
</svg>
